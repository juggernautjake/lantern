<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- The one palette file, shared with the studio. Everything below styles
     itself through its tokens, so the header, the rail and every card change
     together when a palette is chosen — and the studio in its iframe is told
     to change with them. -->
<link rel="stylesheet" href="/app/theme/palettes.css">
<!-- The second, independent colour system: the code themes. Every palette
     already defines --code-bg and friends, so code follows the site by
     default; stamping data-codetheme overrides only those, which is what
     makes "dark page, light code" a legal combination. -->
<link rel="stylesheet" href="/app/theme/code-themes.css">
<style>
/* ===========================================================================
   The platform shell. One file, no build step, no framework: the server has
   no dependencies and neither does this, so a change is a refresh.

   The palette is the studio's "parchment" and "lamplight", so the platform
   and the course look like one product rather than two.
   =========================================================================== */
/* --------------------------------------------------------------- tokens ---
   Every COLOUR here comes from palettes.css and none of it is redefined
   below, which is the whole point: a `:root` block in this file would sit
   later in the source than the palette's own `[data-palette="…"]` rules, and
   at equal specificity the later one wins — so redefining a colour here would
   silently pin the site to one palette while appearing to work.

   What is defined here is the handful of names this page uses that the shared
   palette does not have, each one an alias onto a palette token, plus the
   things that are not colours at all. */
:root {
  --card:       var(--raised);
  --dim:        var(--ink-2);
  --faint:      var(--muted);
  --accent-ink: var(--on-accent);
  --radius: 10px;
  --sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing:border-box; }
body { margin:0; font:15px/1.55 var(--sans); background:var(--paper); color:var(--ink); }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
button { font:inherit; cursor:pointer; }
h1,h2,h3 { font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0 0 .4em; }
h1 { font-size:26px; } h2 { font-size:20px; } h3 { font-size:16px; }
code, pre, .mono { font-family:var(--mono); font-size:13px; }
/* Code is themed by the CODE tokens, not the page ones, so the code theme a
   person chose in the studio is the code theme they see here. */
pre { background:var(--code-bg); color:var(--code-ink); border:1px solid var(--code-rule);
      border-radius:8px; padding:12px 14px; overflow-x:auto; }
:where(p,li) code { background:var(--accent-soft); padding:1px 5px; border-radius:4px; }
pre code { background:none; padding:0; color:inherit; }

/* ------------------------------------------------------------- sign in --- */
.signin { max-width:380px; margin:14vh auto; padding:28px; background:var(--card);
  border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); }
.signin h1 { margin-bottom:4px; }
.signin p.sub { color:var(--dim); margin:0 0 20px; }
label.f { display:block; margin:0 0 14px; }
label.f span { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--faint); margin-bottom:5px; }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
  width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:7px;
  background:var(--paper); color:var(--ink); font:inherit; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.btn { padding:9px 15px; border:1px solid var(--rule); border-radius:7px; background:var(--card);
  color:var(--ink); }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500; }
.btn.small { padding:4px 9px; font-size:13px; border-radius:6px; }
.btn:disabled { opacity:.5; cursor:default; }
.err { color:var(--bad); font-size:14px; margin:10px 0 0; }
.demo { margin-top:22px; padding-top:16px; border-top:1px solid var(--rule); font-size:13px; color:var(--dim); }
.demo b { color:var(--ink); font-weight:600; }
.demo button { background:none; border:0; color:var(--accent); padding:0; font-size:13px; }
.signin-theme { display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:14px;
  border-top:1px solid var(--rule); }
.signin-theme > span { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }

/* --------------------------------------------------------------- shell --- */
.app { display:none; grid-template-columns:224px 1fr; grid-template-rows:52px 1fr;
  grid-template-areas:"brand top" "rail main"; height:100vh; }
.app.on { display:grid; }
.brand { grid-area:brand; display:flex; align-items:center; gap:9px; padding:0 16px;
  border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); background:var(--card); }
.brand .dot { width:11px; height:11px; border-radius:50%; background:var(--accent); flex:none; }
.brand b { font-family:var(--serif); font-size:17px; }
.top { grid-area:top; display:flex; align-items:center; gap:12px; padding:0 18px;
  border-bottom:1px solid var(--rule); background:var(--card); }
.top .spacer { flex:1; }
.top .who { font-size:13px; color:var(--dim); }
.top .who b { color:var(--ink); }
.chip { font-size:12px; padding:3px 9px; border-radius:20px; background:var(--accent-soft);
  color:var(--dim); border:1px solid var(--rule); }
.rail { grid-area:rail; border-right:1px solid var(--rule); background:var(--card);
  padding:14px 10px; overflow-y:auto; }
.rail h4 { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.09em;
  color:var(--faint); margin:18px 8px 7px; }
.rail h4:first-child { margin-top:2px; }
.navitem { display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:7px 9px;
  border:0; border-radius:7px; background:none; color:var(--ink); font-size:14px; }
.navitem:hover { background:var(--accent-soft); }
.navitem[aria-current="true"] { background:var(--accent-soft); color:var(--accent); font-weight:500; }
.navitem .ic { width:16px; text-align:center; opacity:.7; }
.navitem .badge { margin-left:auto; font-size:11px; color:var(--faint); }
.main { grid-area:main; overflow-y:auto; padding:26px 30px 60px; }
.wrap { max-width:940px; }
.lede { color:var(--dim); margin:0 0 20px; max-width:64ch; }

/* ---------------------------------------------------------------- cards --- */
.card { background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:16px 18px; margin:0 0 14px; box-shadow:var(--shadow); }
.card h3 { margin-bottom:2px; }
.card .meta { font-size:13px; color:var(--dim); }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.row { display:flex; align-items:center; gap:10px; }
.stat { text-align:left; }
.stat b { display:block; font-family:var(--serif); font-size:26px; line-height:1.1; }
.stat span { font-size:12px; color:var(--dim); }
.empty { color:var(--faint); font-style:italic; padding:18px 0; }
.pill { font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--dim); }
.pill.ok { color:var(--ok); border-color:var(--ok); }
.pill.bad { color:var(--bad); border-color:var(--bad); }
.pill.warn { color:var(--warn); border-color:var(--warn); }

/* ---------------------------------------------------------------- files --- */
.crumbs { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--dim);
  margin:0 0 14px; flex-wrap:wrap; }
.crumbs button { border:0; background:none; color:var(--accent); padding:2px 0; font-size:13px; }
.filelist { border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card); }
.filerow { display:grid; grid-template-columns:26px 1fr 130px 90px 110px 74px; gap:10px;
  align-items:center; padding:9px 13px; border-bottom:1px solid var(--rule); font-size:14px; }
.filerow:last-child { border-bottom:0; }
.filerow:hover { background:var(--accent-soft); }
.filerow.head { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.08em;
  color:var(--faint); background:var(--paper); }
.filerow .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.filerow .nm small { display:block; color:var(--faint); font-size:12px; }
.filerow .ic { font-size:16px; opacity:.75; }
.filerow .aud { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drop { border:2px dashed var(--rule); border-radius:var(--radius); padding:20px; text-align:center;
  color:var(--dim); margin:14px 0; transition:.15s; }
.drop.over { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.uploader { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.uploader .full { grid-column:1/-1; }

/* ----------------------------------------------------------------- chat --- */
.chatpane { display:grid; grid-template-rows:1fr auto; height:calc(100vh - 52px);
  margin:-26px -30px -60px; }
.transcript { overflow-y:auto; padding:26px 30px 10px; }
.turn { max-width:820px; margin:0 0 20px; }
.turn .role { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.09em;
  color:var(--faint); margin-bottom:6px; }
.turn.user .bubble { background:var(--accent-soft); border:1px solid var(--rule);
  border-radius:var(--radius); padding:11px 14px; }
.turn.assistant .bubble > :first-child { margin-top:0; }
.turn.assistant .bubble > :last-child { margin-bottom:0; }
.bubble img { max-width:100%; border-radius:8px; border:1px solid var(--rule); }
.cites { margin-top:10px; display:flex; flex-wrap:wrap; gap:7px; }
.cites a { font-size:12px; padding:3px 9px; border:1px solid var(--rule); border-radius:20px;
  color:var(--dim); background:var(--card); }
.cites a:hover { border-color:var(--accent); color:var(--accent); text-decoration:none; }
.cites a .n { color:var(--accent); font-weight:600; margin-right:5px; }
.searchnote { font-size:12px; color:var(--faint); margin-top:8px; font-style:italic; }
.savedfiles { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
.savedfile { font-size:12px; border:1px solid var(--rule); border-radius:7px; padding:5px 9px;
  background:var(--card); display:flex; gap:7px; align-items:center; }
.composer { border-top:1px solid var(--rule); background:var(--card); padding:12px 30px 16px; }
.composer .ctx { font-size:12px; color:var(--faint); margin-bottom:7px; display:flex; gap:8px; align-items:center; }
.composer .box { display:flex; gap:9px; align-items:flex-end; }
.composer textarea { resize:none; min-height:44px; max-height:180px; border-radius:9px; }
.thinking { color:var(--dim); font-style:italic; }
.thinking::after { content:"…"; animation:dots 1.4s steps(4,end) infinite; }
@keyframes dots { 0%{opacity:.3} 50%{opacity:1} 100%{opacity:.3} }

/* -------------------------------------------------------------- grading --- */
.verdict { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:var(--radius);
  border:1px solid var(--rule); margin-bottom:16px; background:var(--card); }
.verdict.pass { border-left:4px solid var(--ok); }
.verdict.fail { border-left:4px solid var(--bad); }
.verdict b { font-family:var(--serif); font-size:19px; }
.bars { display:flex; gap:18px; margin:14px 0 20px; flex-wrap:wrap; }
.bar { flex:1; min-width:190px; }
.bar .lbl { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
.bar .track { height:7px; border-radius:4px; background:var(--rule); overflow:hidden; }
.bar .track i { display:block; height:100%; background:var(--accent); }
.bar .why { font-size:12px; color:var(--dim); margin-top:5px; }
.finding { border:1px solid var(--rule); border-left:4px solid var(--rule); border-radius:8px;
  padding:12px 14px; margin-bottom:10px; background:var(--card); }
.finding.error { border-left-color:var(--bad); }
.finding.warning { border-left-color:var(--warn); }
.finding.improve { border-left-color:var(--info); }
.finding.style { border-left-color:var(--faint); }
.finding.praise { border-left-color:var(--ok); }
.finding .hd { display:flex; align-items:baseline; gap:9px; }
.finding .hd b { font-size:14px; }
.finding .ln { font:12px var(--mono); color:var(--faint); }
.finding .sev { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin-left:auto; }
.finding .seen { font-size:13px; color:var(--dim); margin:6px 0 0; }
.finding .why { font-size:14px; margin:7px 0 0; }
.finding .better { margin-top:9px; }
.finding .better .k { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.08em;
  color:var(--faint); display:block; margin-bottom:5px; }
.metrics { display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:var(--dim);
  border-top:1px solid var(--rule); padding-top:12px; margin-top:6px; }
.metrics b { color:var(--ink); font-family:var(--mono); }
.deferred { font-size:13px; color:var(--faint); margin-top:12px; }
textarea.code { font-family:var(--mono); font-size:13px; min-height:260px; line-height:1.5;
  background:var(--code-bg); color:var(--code-ink); border-color:var(--code-rule);
  caret-color:var(--code-caret, var(--accent)); }
textarea.code::selection { background:var(--code-sel, var(--accent-soft)); }
.attempt { display:grid; grid-template-columns:64px 1fr 92px 108px; gap:12px; align-items:center;
  padding:9px 12px; border-bottom:1px solid var(--rule); font-size:13.5px; }
.attempt:last-child { border-bottom:0; }
.attempt .n { color:var(--faint); font-variant-numeric:tabular-nums; }
.attempt .sc { font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
.attempt.best { background:var(--accent-soft); }
.attemptbox { border:1px solid var(--rule); border-radius:var(--radius); background:var(--card);
  overflow:hidden; margin-top:10px; }
.gradehead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.gradehead .best { font-family:var(--serif); font-size:22px; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink);
  color:var(--paper); padding:9px 16px; border-radius:8px; font-size:14px; z-index:50; box-shadow:var(--shadow); }
iframe.studio { width:100%; height:100%; border:1px solid var(--rule);
  border-radius:var(--radius); background:var(--card); }

/* --- the studio, with the assistant beside it ---------------------------- */
.studiowrap { display:grid; grid-template-columns:1fr 0; gap:0; height:calc(100vh - 118px);
  transition:grid-template-columns .18s ease; }
.studiowrap.withchat { grid-template-columns:1fr 380px; gap:14px; }
.sidechat { overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--rule);
  border-radius:var(--radius); background:var(--card); min-width:0; }
.sidechat.hidden { display:none; }
.sidechat .hd { padding:10px 13px; border-bottom:1px solid var(--rule); display:flex;
  align-items:center; gap:9px; }
.sidechat .hd b { font-family:var(--serif); }
.sidechat .ctxchip { font-size:11px; color:var(--dim); border:1px solid var(--rule);
  border-radius:20px; padding:2px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidechat .transcript { flex:1; padding:14px; }
.sidechat .composer { padding:10px 12px 12px; }
.sidechat .turn { max-width:none; margin-bottom:14px; font-size:14px; }

/* --- streaming ----------------------------------------------------------- */
.doing { font-size:12.5px; color:var(--dim); font-style:italic; margin:6px 0;
  display:flex; align-items:center; gap:7px; }
.doing .dot { width:6px; height:6px; border-radius:50%; background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:1} }
@media (prefers-reduced-motion: reduce) { .doing .dot { animation:none; opacity:.7; } }
.cursor { display:inline-block; width:7px; height:1.05em; background:var(--accent);
  vertical-align:-2px; margin-left:2px; animation:pulse 1s steps(2) infinite; }

/* --- teaching ------------------------------------------------------------ */
.gradegrid { overflow-x:auto; border:1px solid var(--rule); border-radius:var(--radius);
  background:var(--card); }
.gradegrid table { border-collapse:collapse; width:100%; font-size:13.5px; }
.gradegrid th, .gradegrid td { padding:8px 11px; text-align:left; border-bottom:1px solid var(--rule);
  white-space:nowrap; }
.gradegrid th { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.08em;
  color:var(--faint); background:var(--paper); }
.gradegrid td.num { font-variant-numeric:tabular-nums; }
.cellstate { font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--rule);
  color:var(--dim); }
.cellstate.submitted { color:var(--ok); border-color:var(--ok); }
.cellstate.draft { color:var(--warn); border-color:var(--warn); }
.cellstate.none { opacity:.5; }
.teachnote { border-left:3px solid var(--accent); padding:10px 14px; background:var(--accent-soft);
  border-radius:0 8px 8px 0; margin:0 0 16px; }
.spread { display:flex; align-items:center; gap:8px; }
.spread .track { flex:1; height:6px; border-radius:4px; background:var(--rule); overflow:hidden; }
.spread .track i { display:block; height:100%; background:var(--warn); }
.spread b { font-variant-numeric:tabular-nums; min-width:56px; text-align:right; }
</style>
</head>
<body>

<div class="signin" id="signin">
  <h1>Lantern</h1>
  <p class="sub">The learning platform, its filing system, and the assistant.</p>
  <form id="loginform">
    <label class="f"><span>Email</span><input type="email" id="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    <p class="err" id="loginerr" hidden></p>
  </form>
  <div class="demo" id="demo"></div>
  <div class="signin-theme">
    <span>Theme</span>
    <div class="palette-picker" id="palette-signin" role="group" aria-label="Colour theme"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="brand"><span class="dot"></span><b>Lantern</b></div>
  <div class="top">
    <span class="chip" id="classchip"></span>
    <span class="spacer"></span>
    <span class="chip" id="aichip"></span>
    <span class="who" id="who"></span>
    <div class="palette-picker" id="palette" role="group" aria-label="Colour theme"></div>
    <button class="btn small" id="signout">Sign out</button>
  </div>
  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ===========================================================================
   The client. Plain DOM, no framework — the whole thing is small enough that
   a framework would be more code than it saves, and it means there is nothing
   to build before this runs.
   =========================================================================== */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const state = { me: null, view: 'home', args: {}, thread: null, folder: null, sending: false };

  /* ------------------------------------------------------------- helpers */

  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : String(v));
    });
    (Array.isArray(kids) ? kids : kids ? [kids] : []).forEach((c) => {
      if (c === null || c === undefined || c === false) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  async function api(path, opts) {
    const o = opts || {};
    const res = await fetch(path, {
      method: o.method || 'GET',
      headers: o.body instanceof FormData ? {} : (o.body ? { 'content-type': 'application/json' } : {}),
      body: o.body instanceof FormData ? o.body : (o.body ? JSON.stringify(o.body) : undefined),
      credentials: 'same-origin',
    });
    const ct = res.headers.get('content-type') || '';
    const data = ct.includes('json') ? await res.json() : await res.text();
    if (!res.ok) {
      const e = new Error((data && data.error) || res.statusText);
      e.why = data && data.why; e.status = res.status; e.detail = data && data.detail;
      throw e;
    }
    return data;
  }

  function toast(msg) {
    const t = el('div', { class: 'toast', text: msg });
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  const bytes = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
    : (n / 1048576).toFixed(1) + ' MB');
  const when = (s) => {
    if (!s) return '';
    const d = new Date(String(s).replace(' ', 'T') + 'Z');
    const days = Math.round((Date.now() - d.getTime()) / 86400000);
    return days === 0 ? 'today' : days === 1 ? 'yesterday' : days < 30 ? days + ' days ago'
      : d.toLocaleDateString();
  };
  const ICON = { image: '🖼', submission: '✎', rubric: '⚖', reading: '📖', dataset: '▦',
    brief: '📋', resource: '📄', reference: '🔖', feedback: '💬', transcript: '🗒',
    'starter-code': '⌨', solution: '🔑', export: '⇩', template: '⧉', recording: '▶', other: '📄' };

  /* A small markdown renderer: enough for what the assistant writes, and
     nothing that could inject markup. Everything is escaped first, then a
     fixed set of patterns is turned back into elements. */
  function markdown(src) {
    const blocks = String(src || '').split(/```/);
    let out = '';
    blocks.forEach((chunk, i) => {
      if (i % 2) {                                   // inside a fence
        const nl = chunk.indexOf('\n');
        const lang = nl > 0 ? chunk.slice(0, nl).trim() : '';
        const code = nl > 0 ? chunk.slice(nl + 1) : chunk;
        out += '<pre><code data-lang="' + esc(lang) + '">' + esc(code.replace(/\n$/, '')) + '</code></pre>';
        return;
      }
      out += inline(chunk);
    });
    return out;
  }

  function inline(text) {
    const lines = esc(text).split('\n');
    let html = '', list = null;
    const closeList = () => { if (list) { html += '</' + list + '>'; list = null; } };
    lines.forEach((raw) => {
      let line = raw;
      // links and images, before anything else can eat the brackets
      line = line.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,
        (m, alt, url) => (safeUrl(url) ? '<img src="' + esc(url) + '" alt="' + alt + '">' : alt));
      line = line.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
        (m, t, url) => (safeUrl(url) ? '<a href="' + esc(url) + '"' +
          (/^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + t + '</a>' : t));
      line = line.replace(/`([^`]+)`/g, '<code>$1</code>');
      line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      line = line.replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>');

      const h = /^(#{1,4})\s+(.*)$/.exec(line);
      const li = /^\s*[-*]\s+(.*)$/.exec(line);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (h) { closeList(); html += '<h' + (h[1].length + 2) + '>' + h[2] + '</h' + (h[1].length + 2) + '>'; }
      else if (li) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += '<li>' + li[1] + '</li>'; }
      else if (ol) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += '<li>' + ol[1] + '</li>'; }
      else if (!line.trim()) { closeList(); }
      else { closeList(); html += '<p>' + line + '</p>'; }
    });
    closeList();
    return html;
  }
  const safeUrl = (u) => /^(https?:\/\/|\/)/i.test(String(u || ''));

  function selectOf(list, current, onPick) {
    const sel = el('select', { onchange: (e) => onPick(e.target.value) },
      list.map((o) => el('option', { value: o.id, selected: o.id === current ? true : null },
        o.note ? o.name + ' — ' + o.note : o.name)));

  function applyCodeTheme(id, opts) {
    const o = opts || {};
    if (id) document.documentElement.setAttribute('data-codetheme', id);
    else document.documentElement.removeAttribute('data-codetheme');
    if (!o.quiet) {
      try { localStorage.setItem('lantern-codetheme', id || ''); } catch (e) { /* private window */ }
    }
    tellTheStudio(null, id);
  }

  function applyPalette(id, opts) {
    const o = opts || {};
    if (id) document.documentElement.setAttribute('data-palette', id);
    else document.documentElement.removeAttribute('data-palette');
    if (!o.quiet) {
      try { localStorage.setItem('lantern-palette', id || ''); } catch (e) { /* private window */ }
    }
    paintPicker();
    tellTheStudio(id);
  }

  /* The studio runs in an iframe with its own copy of the palettes, so it has
     to be told. Without this the shell changes and the course inside it does
     not, which looks like a bug in both. */
  function tellTheStudio(paletteId, codeThemeId) {
    const msg = { lantern: 'palette' };
    if (paletteId !== null && paletteId !== undefined) msg.id = paletteId || '';
    if (codeThemeId !== null && codeThemeId !== undefined) msg.code = codeThemeId || '';
    document.querySelectorAll('iframe.studio').forEach((f) => {
      try { f.contentWindow.postMessage(msg, '*'); }
      catch (e) { /* not loaded yet — the iframe's onload asks again */ }
    });
  }

  function paintPicker() {
    const now = document.documentElement.getAttribute('data-palette') || '';
    document.querySelectorAll('#palette .swatch, #palette-signin .swatch').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.p === now));
    });
  }

  function buildPicker() {
    ['#palette', '#palette-signin'].forEach((sel) => {

      host.innerHTML = '';
      PALETTES.forEach((p) => {
        host.appendChild(el('button', {
          class: 'swatch ' + p.id, 'data-p': p.id, 'aria-pressed': 'false',
          title: p.name + ' — ' + p.note, 'aria-label': 'Use the ' + p.name + ' theme',
          onclick: () => applyPalette(p.id),
        }, [el('i'), el('b')]));

  async function viewFiles(m) {
    const path = state.args.path || state.me.folders.private;
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('h1', { text: 'Files' }));

    let listing;
    try { listing = await api('/api/files?path=' + encodeURIComponent(path)); }
    catch (e) {
      wrap.appendChild(el('div', { class: 'card' }, [
        el('h3', { text: 'You cannot open that folder' }),
        el('p', { class: 'meta', text: e.why || e.message }),
      ]));
      return;
    }
    state.folder = listing.folder;

    /* Breadcrumbs, plus the shortcuts a person actually uses. */
    const crumbs = el('div', { class: 'crumbs' });
    const parts = path.split('/').filter(Boolean);
    let acc = '';
    crumbs.appendChild(el('button', { onclick: () => go('files', { path: state.me.folders.private }) }, 'My files'));
    parts.forEach((p, i) => {
      acc += '/' + p;
      const here = acc;
      crumbs.appendChild(el('span', { text: '/' }));
      crumbs.appendChild(i === parts.length - 1
        ? el('span', { text: p })
        : el('button', { onclick: () => go('files', { path: here }) }, p));
    });
    crumbs.appendChild(el('span', { style: 'flex:1' }));
    crumbs.appendChild(el('span', { class: 'pill', text: 'Visible to: ' + listing.folder.audience }));
    wrap.appendChild(crumbs);

    const jump = (label, p) => shortcuts.appendChild(el('button', { class: 'btn small',

    jump('Portfolio', state.me.folders.portfolio);

      jump(c.code + ' resources', '/classes/' + c.id + '/resources');

      wrap.appendChild(el('div', { class: 'filelist' },

  async function details(f) {
    const [aud, vers] = await Promise.all([
      api('/api/files/' + f.id + '/audience').catch(() => null),
      api('/api/files/' + f.id + '/versions').catch(() => null),
    ]);
    const m = $('#main');
    m.innerHTML = '';
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('button', { class: 'btn small', onclick: () => go('files', state.args) }, '← back'));
    wrap.appendChild(el('h1', { text: f.title || f.name, style: 'margin-top:14px' }));
    wrap.appendChild(el('p', { class: 'lede', text: f.description || 'No description was given.' }));

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: 'What this is' }),
      kv('Filed as', f.name), kv('What it is for', f.purpose.replace(/-/g, ' ')),
      kv('Where it came from', f.source.replace(/-/g, ' ') + (f.sourceUrl ? ' — ' + f.sourceUrl : '')),
      kv('Type and size', f.mime + ' · ' + bytes(f.size)),
      kv('Version', 'v' + f.version + (vers ? ' of ' + vers.versions.length : '')),
      kv('Tags', f.tags.join(', ') || '—'),
      kv('Courses', f.courses.join(', ') || '—'),
      kv('Attached to', f.links.map((l) => l.entity_type + ' ' + l.entity_id).join(', ') || '—'),
    ]));

    if (aud) {
      wrap.appendChild(el('div', { class: 'card' }, [

          (g.effect === 'deny' ? '✕ ' : '✓ ') + g.who + ' — ' + g.permission + ' on ' + g.scope
          + (g.reason ? ' (' + g.reason + ')' : '')))) : el('p', { class: 'meta',
          text: 'No individual grants: access comes from the class roster.' }),
      ]));
    }
    if (f.isImage) wrap.appendChild(el('div', { class: 'card' }, el('img', { src: f.url, style: 'max-width:100%' })));
  }

  const kv = (k, v) => el('div', { class: 'row', style: 'align-items:baseline;gap:12px' }, [
    el('span', { style: 'width:150px;flex:none;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)', text: k }),
    el('span', { text: v }),
  ]);

  function uploader(path) {
    const box = el('div', { class: 'card', style: 'margin-top:20px' });
    box.appendChild(el('h3', { text: 'Add a file' }));
    box.appendChild(el('p', { class: 'meta', text:
      'Every file needs to say what it is for and where it came from. That is what makes this a filing '
      + 'system rather than a folder — and it is what lets the assistant find things later.' }));

    const drop = el('div', { class: 'drop', text: 'Drop a file here, or choose one' });
    const input = el('input', { type: 'file', multiple: true, style: 'display:none' });
    drop.addEventListener('click', () => input.click());
    ['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => {
      ev.preventDefault(); drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, () => drop.classList.remove('over')));
    drop.addEventListener('drop', (ev) => { ev.preventDefault(); send(ev.dataTransfer.files); });
    input.addEventListener('change', () => send(input.files));

    const purpose = el('select', {}, ['resource', 'reading', 'dataset', 'brief', 'rubric', 'reference',
      'starter-code', 'image', 'template', 'export', 'other'].map((p) => el('option', { value: p, text: p })));
    const title = el('input', { type: 'text', placeholder: 'Title (optional)' });
    const desc = el('input', { type: 'text', placeholder: 'One line: what is this and why does it exist?' });
    const tags = el('input', { type: 'text', placeholder: 'Tags, comma separated' });

    box.appendChild(drop);
    box.appendChild(el('div', { class: 'uploader' }, [
      el('label', { class: 'f' }, [el('span', { text: 'What it is for' }), purpose]),
      el('label', { class: 'f' }, [el('span', { text: 'Title' }), title]),
      el('label', { class: 'f full' }, [el('span', { text: 'Description' }), desc]),
      el('label', { class: 'f full' }, [el('span', { text: 'Tags' }), tags]),
    ]));
    box.appendChild(input);

    async function send(files) {
      if (!files || !files.length) return;
      const fd = new FormData();
      fd.append('path', path);
      fd.append('purpose', purpose.value);
      fd.append('title', title.value);
      fd.append('description', desc.value);
      fd.append('tags', tags.value);
      Array.from(files).forEach((f) => fd.append('file', f, f.name));
      try {
        const out = await api('/api/files', { method: 'POST', body: fd });
        toast(out.files.length + ' file(s) filed');
        go('files', { path });
      } catch (e) { toast(e.why || e.message); }
    }
    return box;
  }

  function viewSearch(m) {
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('h1', { text: 'Search' }));
    wrap.appendChild(el('p', { class: 'lede', text:
      'Lessons, exercises and files at once. You only ever see what you could open yourself — and so does '
      + 'the assistant, because it searches through exactly this.' }));
    const input = el('input', { type: 'search', placeholder: 'What are you looking for?' });
    const results = el('div', { style: 'margin-top:18px' });
    wrap.appendChild(input); wrap.appendChild(results);
    input.focus();

    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const q = input.value.trim();
        results.innerHTML = '';
        if (q.length < 2) return;
        const out = await api('/api/search?q=' + encodeURIComponent(q));
        if (!out.results.length) { results.appendChild(el('div', { class: 'empty', text: 'Nothing you can see matches that.' })); return; }
        out.results.forEach((r) => {
          results.appendChild(el('div', { class: 'card' }, [
            el('div', { class: 'row' }, [
              el('span', { class: 'pill', text: r.type }),
              el('h3', { text: r.title, style: 'margin:0' }),
            ]),
            el('p', { class: 'meta', text: r.snippet }),
            el('button', { class: 'btn small', onclick: () => openResult(r) }, 'Open'),
          ]));
        });
      }, 220);
    });
  }

  function openResult(r) {
    if (r.type === 'file') { api('/api/files/' + r.fileId).then(details); return; }
    if (r.url && r.url.startsWith('/studio')) { go('studio', { hash: r.url.split('#')[1] }); return; }

  /* ------------------------------------------------------------- grades */

  /* Everything handed in, every attempt, and the mark on each. The rule this
     screen exists to make obvious: the BEST attempt is the one that counts, so
     going again can only help. A gradebook that hides that teaches people not
     to retry. */
  async function viewGrades(m) {
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('h1', { text: 'Grades' }));

    let out;
    try { out = await api('/api/me/grades'); }
    catch (e) {
      wrap.appendChild(el('div', { class: 'card' }, el('p', { class: 'meta', text: e.why || e.message })));
      return;
    }
    const s = out.summary;

    wrap.appendChild(el('p', { class: 'lede', text:
      'Your best attempt is the one that counts, so there is nothing to lose by going again. '
      + 'A mark with a ? beside it is a recommendation the auto-grader produced and a teacher has '
      + 'not confirmed yet.' }));

    wrap.appendChild(el('div', { class: 'grid', style: 'margin-bottom:22px' }, [
      stat(s.set, 'set'),
      stat(s.started, 'started'),
      stat(s.marked, 'marked'),
      stat(s.average === null ? '—' : s.average + '%', 'average of your best'),
    ]));

    if (!out.assignments.length) {
      wrap.appendChild(el('div', { class: 'empty', text: 'Nothing has been set yet.' }));
      return;
    }

    out.assignments.forEach((a) => {
      const card = el('div', { class: 'card' });
      card.appendChild(el('div', { class: 'gradehead' }, [
        el('h3', { text: a.title, style: 'margin:0' }),
        el('span', { class: 'pill', text: a.kind.replace(/-/g, ' ') }),
        el('span', { class: 'pill', text: a.class_code }),
        el('span', { style: 'flex:1' }),
        a.best !== null
          ? el('span', { class: 'best', text: a.best + '/100' })
          : el('span', { class: 'pill warn', text: 'not attempted' }),
      ]));
      card.appendChild(el('div', { class: 'meta', text:
        (a.due_at ? 'Due ' + when(a.due_at) + ' · ' : '')
        + (a.attempts.length
          ? a.attempts.length + ' attempt' + (a.attempts.length === 1 ? '' : 's')
          : 'no attempts yet') }));

      if (a.attempts.length) {
        const box = el('div', { class: 'attemptbox' });
        a.attempts.forEach((t) => {
          const isBest = t.score !== null && t.score === a.best;
          box.appendChild(el('div', { class: 'attempt' + (isBest ? ' best' : '') }, [
            el('span', { class: 'n', text: '#' + t.attempt }),
            el('span', {}, [
              el('span', { text: t.feedback || (t.correctness && t.correctness.pass ? 'Passed' : 'Not yet') }),
              t.craft && typeof t.craft.score === 'number'
                ? el('small', { style: 'display:block;color:var(--faint)',
                  text: 'correctness ' + (t.correctness ? t.correctness.percent : '—') + '% · craft '
                    + t.craft.score + '/100' })
                : null,
            ]),

            el('span', { class: 'sc', title: t.confirmed ? 'confirmed by a teacher' : 'not confirmed yet',
              text: t.score === null ? '—' : t.score + (t.confirmed ? '' : ' ?') }),

  /* ---------------------------------------------------------- assignment */

  async function viewAssignment(m) {
    const list = await api('/api/assignments');

    wrap.appendChild(el('h1', { text: a.title, style: 'margin-top:14px' }));
    wrap.appendChild(el('div', { class: 'card', html: markdown(String(a.brief || '')) }));

    /* What you have already handed in, so a second attempt starts from
       knowing how the first went rather than from a blank box. */
    let history = null;
    try {
      const g = await api('/api/me/grades');
      history = (g.assignments || []).filter((x) => x.assignment_id === a.id)[0] || null;

          el('span', { class: 'n', text: '#' + t.attempt }),

          el('span', { class: 'meta', text: t.submittedAt ? when(t.submittedAt) : t.status }),
          el('span', { class: 'sc', text: t.score === null ? '—' : t.score + (t.confirmed ? '' : ' ?') }),
        ]));
      });

      box.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('button', { class: 'btn small', onclick: () => {
          const last = history.attempts[0];
          editor.value = '';
          // Re-open the last attempt's code so a retry edits rather than retypes.
          api('/api/submissions/' + last.submissionId + '/source')
            .then((r) => { editor.value = r.source || ''; toast('Your last attempt is loaded'); })
            .catch(() => toast('That attempt could not be loaded'));
        } }, 'Load my last attempt'),
        el('span', { class: 'meta', text: 'Your best attempt is the one that counts.' }),
      ]));
      wrap.appendChild(box);
    }

    const editor = el('textarea', { class: 'code', spellcheck: 'false',
      placeholder: 'Write your ColdFusion here, then press Check.' });
    const saved = localStorage.getItem('lantern-work-' + a.id);
    if (saved) editor.value = saved;
    editor.addEventListener('input', () => localStorage.setItem('lantern-work-' + a.id, editor.value));

    const results = el('div', { style: 'margin-top:18px' });
    const check = el('button', { class: 'btn primary', onclick: () => run(false) }, 'Check my work');
    const submit = el('button', { class: 'btn', onclick: () => run(true) }, 'Hand it in');

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: 'Your answer' }), editor,
      el('div', { class: 'row', style: 'margin-top:12px' }, [check, submit,
        el('span', { class: 'meta', text: 'Checking is instant and free. It does not use the assistant.' })]),
    ]));
    wrap.appendChild(results);

    async function run(handIn) {
      check.disabled = submit.disabled = true;
      results.innerHTML = '';
      results.appendChild(el('div', { class: 'thinking', text: 'Running your page' }));
      try {
        // Handing in creates the attempt, and the grade has to be attached to
        // THAT attempt — without the id the server grades the code and records
        // nothing, which looks like it worked and leaves the attempt unmarked.
        let submissionId = null;
        if (handIn) {
          const sub = await api('/api/submissions', { method: 'POST',
            body: { assignmentId: a.id, source: editor.value, submit: true } });
          submissionId = sub && sub.id;
        }
        const g = await api('/api/grade' + (handIn ? '' : '/preview'), { method: 'POST',
          body: { ref: a.ref, source: editor.value, ai: handIn, submissionId } });
        results.innerHTML = '';
        results.appendChild(gradeReport(g, a));
        if (handIn) {
          toast('Handed in — attempt recorded. Your best attempt is the one that counts.');
        }
      } catch (e) {
        results.innerHTML = '';
        results.appendChild(el('div', { class: 'card' }, [
          el('h3', { text: 'That could not be checked' }),
          el('p', { class: 'meta', text: e.detail || e.why || e.message }),
        ]));
      }
      check.disabled = submit.disabled = false;
    }
  }

  /* The grading report: correctness, then craft, then the written review. */
  function gradeReport(g, a) {
    const box = el('div');
    const c = g.correctness;
    box.appendChild(el('div', { class: 'verdict ' + (c.pass ? 'pass' : 'fail') }, [
      el('b', { text: c.pass ? 'Passed' : 'Not yet' }),
      el('span', { text: c.pass ? 'Every check passed.'
        : c.rows.filter((r) => !r.pass).length + ' of ' + c.rows.length + ' checks failed.' }),
      el('span', { style: 'flex:1' }),
      g.score ? el('b', { text: g.score.total + '/100' }) : null,
    ]));

    if (g.score) {
      const bars = el('div', { class: 'bars' });
      g.score.parts.forEach((p) => {
        bars.appendChild(el('div', { class: 'bar' }, [
          el('div', { class: 'lbl' }, [
            el('span', { text: p.name + ' · ' + Math.round(p.weight * 100) + '%' }),
            el('b', { text: p.value + '%' }),
          ]),
          el('div', { class: 'track' }, el('i', { style: 'width:' + p.value + '%' })),
          el('div', { class: 'why', text: p.why }),
        ]));
      });
      box.appendChild(bars);
    }

    if (!c.pass) {
      box.appendChild(el('h3', { text: 'What the checks said' }));
      c.rows.filter((r) => !r.pass).forEach((r) => {
        box.appendChild(el('div', { class: 'finding error' }, [
          el('div', { class: 'hd' }, [el('b', { text: r.message }),
            el('span', { class: 'sev', text: r.tierLabel })]),
          r.expected !== undefined ? el('div', { class: 'better' }, [
            el('span', { class: 'k', text: 'Expected' }),
            el('pre', { text: String(r.expected).slice(0, 400) }),
            el('span', { class: 'k', text: 'You produced' }),
            el('pre', { text: String(r.actual === undefined ? '' : r.actual).slice(0, 400) }),
          ]) : null,
        ]));
      });
    }

    /* Craft. This is the half the brief was written for. */
    const craft = g.craft;
    box.appendChild(el('h3', { text: 'How it reads', style: 'margin-top:24px' }));
    box.appendChild(el('p', { class: 'meta', text: craft.headline }));
    craft.findings.forEach((f) => {
      box.appendChild(el('div', { class: 'finding ' + f.severity }, [
        el('div', { class: 'hd' }, [
          el('b', { text: f.label }),
          f.line ? el('span', { class: 'ln', text: 'line ' + f.line }) : null,
          el('span', { class: 'sev', text: f.severity }),
        ]),
        f.seen ? el('p', { class: 'seen', text: f.seen }) : null,
        f.why ? el('p', { class: 'why', text: f.why }) : null,
        f.better ? el('div', { class: 'better' }, [
          el('span', { class: 'k', text: 'Better' }),
          /[<#]/.test(f.better) ? el('pre', { text: f.better }) : el('p', { text: f.better }),
        ]) : null,
      ]));
    });

    if (craft.comparison) {
      const cm = craft.comparison;
      box.appendChild(el('div', { class: 'metrics' }, [
        el('span', { html: 'steps <b>' + cm.steps.mine + '</b> vs benchmark <b>' + cm.steps.bench + '</b>' }),
        el('span', { html: 'queries <b>' + cm.queries.mine + '</b> vs <b>' + cm.queries.bench + '</b>' }),
        el('span', { html: 'lines <b>' + cm.lines.mine + '</b> vs <b>' + cm.lines.bench + '</b>' }),
        el('span', { html: 'loops <b>' + cm.loops.mine + '</b>' }),
      ]));
    }

    if (craft.deferred && craft.deferred.length) {
      box.appendChild(el('div', { class: 'deferred', text:
        'Coming up in later lessons, so not counted here: '
        + craft.deferred.map((d) => d.label + (d.until ? ' (' + d.until + ')' : '')).join('; ') }));
    }

    if (g.written) {
      box.appendChild(el('h3', { text: 'A reviewer’s read', style: 'margin-top:24px' }));
      box.appendChild(el('p', { class: 'meta', text: g.written.summary }));
      if (g.written.approach) box.appendChild(el('p', { text: g.written.approach }));
      g.written.points.forEach((p) => {
        box.appendChild(el('div', { class: 'finding ' + p.severity }, [
          el('div', { class: 'hd' }, [el('b', { text: p.label }),
            p.line ? el('span', { class: 'ln', text: 'line ' + p.line }) : null,
            el('span', { class: 'sev', text: 'reviewer' })]),
          el('p', { class: 'why', text: p.why }),
          p.better ? el('div', { class: 'better' }, [el('span', { class: 'k', text: 'Better' }), el('pre', { text: p.better })]) : null,
        ]));
      });
    }

    if (g.writtenProblem) {
      box.appendChild(el('div', { class: 'card', style: 'margin-top:18px' }, [
        el('h3', { text: 'No reviewer’s read this time' }),
        el('p', { class: 'meta', text: 'Your mark is unaffected — correctness and craft are both worked '
          + 'out here, without the model. What failed: ' + g.writtenProblem }),
      ]));
    }
    if (g.grade) {
      box.appendChild(el('p', { class: 'deferred', text: g.grade.note }));
    }
    return box;
  }

  /* ---------------------------------------------------------------- chat */

  function viewChat(m) {
    m.className = 'main';
    const pane = el('div', { class: 'chatpane' });
    const transcript = el('div', { class: 'transcript' });
    const box = el('textarea', { placeholder: 'Ask about your work, this course, or anything you need to find.',
      rows: 1 });
    const sendBtn = el('button', { class: 'btn primary', onclick: send }, 'Send');
    const webToggle = el('input', { type: 'checkbox', checked: true, id: 'webtoggle' });

    pane.appendChild(transcript);
    pane.appendChild(el('div', { class: 'composer' }, [
      el('div', { class: 'ctx' }, [
        el('span', { text: '✻ Knows: your class, your progress, your files' }),
        el('label', { style: 'display:flex;gap:5px;align-items:center;cursor:pointer' },
          [webToggle, el('span', { text: 'search the web' })]),
        el('span', { style: 'flex:1' }),
        el('button', { class: 'btn small', onclick: () => { state.thread = null; viewChat($('#main')); } }, 'New conversation'),
      ]),
      el('div', { class: 'box' }, [box, sendBtn]),
    ]));
    m.appendChild(pane);

    box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(180, box.scrollHeight) + 'px'; });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    box.focus();

    if (!state.me.ai.configured) {
      transcript.appendChild(el('div', { class: 'card' }, [
        el('h3', { text: 'The assistant is not switched on yet' }),
        el('p', { text: 'This server has no ANTHROPIC_API_KEY, so chat, web search and the written half of '
          + 'code review are off. Everything else — the auto-grader, the deterministic code reviewer, '
          + 'search and the whole filing system — works without it.' }),
        el('p', { class: 'meta', html: 'To switch it on: copy <code>server/.env.example</code> to '
          + '<code>server/.env</code>, put your key in it, and restart.' }),
      ]));
    } else if (state.thread) {
      loadThread(state.thread, transcript);
    } else {
      transcript.appendChild(el('div', { class: 'card' }, [
        el('h3', { text: 'Ask anything' }),
        el('p', { class: 'meta', text: 'It can see your course, your files and your progress — and only what '
          + 'you are allowed to see. Try:' }),
        el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px;margin-top:8px' },
          ['Where is the rubric for my next assignment?',
            'Why is my page slow?',
            'What is an encumbrance, in the words a school board would use?',
            'Find me a diagram of the ColdFusion request lifecycle and save it to my files',
          ].map((q) => el('button', { class: 'btn small', onclick: () => { box.value = q; send(); } }, q))),
      ]));
    }

    async function send() {
      const text = box.value.trim();
      if (!text || state.sending) return;
      state.sending = true;
      box.value = ''; box.style.height = 'auto';
      if (transcript.querySelector('.card')) transcript.innerHTML = '';

      transcript.appendChild(turn('user', markdown(text)));
      const pending = el('div', { class: 'turn assistant' }, [
        el('div', { class: 'role', text: 'Assistant' }),
        el('div', { class: 'bubble' }, el('div', { class: 'thinking', text: 'Thinking' })),
      ]);
      transcript.appendChild(pending);
      transcript.scrollTop = transcript.scrollHeight;
      sendBtn.disabled = true;

      try {
        await streamChat({
          text, web: webToggle.checked,
          classId: (state.me.classes[0] || {}).id,
          situation: { where: 'the platform' },
          into: pending, transcript,
        });
      } catch (e) {
        pending.querySelector('.bubble').innerHTML = '';
        pending.querySelector('.bubble').appendChild(el('p', { class: 'err',
          text: e.detail || e.why || e.message }));
      }
      sendBtn.disabled = false;
      state.sending = false;
      transcript.scrollTop = transcript.scrollHeight;
    }
  }

  /* Streamed. The text appears as it is written, and what the assistant is
     doing between fragments — searching, reading a file — is shown rather than
     left as a blank pause, because a six-second silence reads as a hang.

     Falls back to the whole-response endpoint if the browser or a proxy in
     between will not stream, so the feature can never be the reason a reply
     does not arrive. */
  async function streamChat(spec) {
    const bubble = spec.into.querySelector('.bubble');
    bubble.innerHTML = '';
    const doing = el('div', { class: 'doing' }, [el('span', { class: 'dot' }), el('span', { text: 'Thinking' })]);
    const body = el('div');
    const cursor = el('span', { class: 'cursor' });
    bubble.appendChild(doing);
    bubble.appendChild(body);
    body.appendChild(cursor);

    let res;
    try {
      res = await fetch('/api/chat/stream', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          threadId: state.thread, text: spec.text, web: spec.web,
          classId: spec.classId, situation: spec.situation,
        }),
      });
    } catch (e) { res = null; }

    if (!res || !res.ok || !res.body || !/event-stream/.test(res.headers.get('content-type') || '')) {
      // Not streaming: ask for the whole thing instead.
      if (res && !res.ok) {
        const err = await res.json().catch(() => ({}));
        const e = new Error(err.error || 'That did not work');
        e.detail = err.detail; throw e;
      }
      const out = await api('/api/chat', { method: 'POST', body: {
        threadId: state.thread, text: spec.text, web: spec.web,
        classId: spec.classId, situation: spec.situation } });
      finish(out);
      return;
    }

    let text = '';
    let done = null;
    await readEvents(res.body, (event, data) => {
      if (event === 'text') {
        text += data.text;
        body.innerHTML = markdown(text);
        body.appendChild(cursor);
        spec.transcript.scrollTop = spec.transcript.scrollHeight;
      } else if (event === 'search') {
        say(doing, 'Searching the web for “' + data.query + '”');
      } else if (event === 'results') {
        say(doing, data.error ? 'The search failed (' + data.error + ')' : 'Reading ' + data.count + ' result(s)');
      } else if (event === 'using') {
        say(doing, TOOL_SAYS[data.name] || ('Using ' + data.name));
      } else if (event === 'used') {
        say(doing, 'Thinking');
      } else if (event === 'done') {
        done = data;
      } else if (event === 'failed') {
        const e = new Error(data.error); e.detail = data.detail; throw e;
      }
    });

    cursor.remove();
    doing.remove();
    if (done) finish(done, text);

    function finish(out, already) {
      state.thread = out.threadId;
      const rendered = assistantTurn(Object.assign({}, out, { text: out.text || already || '' }));
      spec.into.replaceWith(rendered);
      if (out.budget) {
        state.me.ai.budget = out.budget;
        $('#aichip').textContent = 'assistant on · ' + (out.budget.cap_calls - out.budget.calls) + ' left';
      }
      spec.transcript.scrollTop = spec.transcript.scrollHeight;
    }
  }

  const TOOL_SAYS = {
    search_platform: 'Searching your course and files',
    list_files: 'Looking through the filing system',
    read_file: 'Reading a file',
    save_file: 'Filing that for you',
    save_image_from_url: 'Downloading and filing the image',
    my_progress: 'Checking where you are up to',
    class_overview: 'Reading the class',
    common_problems: 'Counting what came up across the class',
    student_detail: 'Opening that student’s work',
  };

  function say(node, what) {
    const label = node.querySelector('span:last-child');
    if (label) label.textContent = what;
  }

  /* Server-sent events off a fetch body — EventSource cannot POST. */
  async function readEvents(stream, onEvent) {
    const reader = stream.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let at;
      while ((at = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, at);
        buf = buf.slice(at + 2);
        let ev = 'message';
        const lines = [];
        frame.split('\n').forEach((l) => {
          if (l.startsWith('event:')) ev = l.slice(6).trim();
          else if (l.startsWith('data:')) lines.push(l.slice(5).trim());
        });
        if (!lines.length) continue;
        try { onEvent(ev, JSON.parse(lines.join('\n'))); } catch (e) { /* keep reading */ }
      }
    }
  }

  const turn = (role, html) => el('div', { class: 'turn ' + role }, [
    el('div', { class: 'role', text: role === 'user' ? 'You' : 'Assistant' }),
    el('div', { class: 'bubble', html }),
  ]);

  function assistantTurn(out) {
    const t = el('div', { class: 'turn assistant' }, [el('div', { class: 'role', text: 'Assistant' })]);
    const bubble = el('div', { class: 'bubble', html: markdown(out.text) });
    t.appendChild(bubble);

    if (out.citations && out.citations.length) {
      const cites = el('div', { class: 'cites' });
      out.citations.forEach((c, i) => {
        cites.appendChild(el('a', { href: c.url, target: '_blank', rel: 'noopener noreferrer',
          title: c.quote || c.url }, [el('span', { class: 'n', text: String(i + 1) }),
          document.createTextNode(c.title || c.url)]));
      });
      t.appendChild(cites);
    }
    if (out.searches && out.searches.length) {
      t.appendChild(el('div', { class: 'searchnote', text: 'Searched: '
        + out.searches.map((s) => (s.error ? s.query + ' (' + s.error + ')' : s.query)).join(' · ') }));
    }
    if (out.files && out.files.length) {
      const box = el('div', { class: 'savedfiles' });
      out.files.forEach((f) => {
        box.appendChild(el('div', { class: 'savedfile' }, [
          el('span', { text: (f.isImage ? '🖼 ' : '📄 ') + f.name }),
          el('a', { href: f.url, target: '_blank', text: 'open' }),
          el('span', { class: 'pill', text: f.audience }),
        ]));
        if (f.isImage) t.appendChild(el('img', { src: f.url, alt: f.name, style: 'margin-top:10px;max-width:420px' }));
      });
      t.appendChild(box);
    }
    return t;
  }

  async function loadThread(id, transcript) {
    const out = await api('/api/threads/' + id);
    transcript.innerHTML = '';
    out.messages.filter((mm) => mm.role !== 'tool' && mm.text).forEach((mm) => {
      transcript.appendChild(turn(mm.role === 'user' ? 'user' : 'assistant', markdown(mm.text)));
    });
  }

  async function viewThreads(m) {
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('h1', { text: 'Conversations' }));
    const out = await api('/api/threads');
    if (!out.threads.length) { wrap.appendChild(el('div', { class: 'empty', text: 'Nothing yet.' })); return; }
    out.threads.forEach((t) => {
      wrap.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [
          el('h3', { text: t.title || 'Untitled', style: 'margin:0' }),
          el('span', { style: 'flex:1' }),
          el('span', { class: 'meta', text: when(t.updated_at) }),
          el('button', { class: 'btn small', onclick: () => { state.thread = t.id; go('chat'); } }, 'Open'),
        ]),
      ]));
    });
  }

  /* ------------------------------------------------------------- account */

  /* What the platform holds about you, and the button that gives it to you.
     A person should not have to ask a human for their own record. */
  async function viewAccount(m) {
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    wrap.appendChild(el('h1', { text: 'Your record' }));
    wrap.appendChild(el('p', { class: 'lede', text:
      'Everything this platform holds about you, and how long it keeps it.' }));

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: state.me.user.name }),
      el('p', { class: 'meta', text: state.me.user.role + ' · '
        + state.me.classes.map((c) => c.code + ' (' + c.role + ')').join(', ') }),
    ]));

    if (state.me.ai.budget) {
      const b = state.me.ai.budget;
      wrap.appendChild(el('div', { class: 'card' }, [
        el('h3', { text: 'Assistant use this month' }),
        el('p', { class: 'meta', text: b.calls + ' of ' + b.cap_calls + ' requests, '
          + b.web_searches + ' of ' + b.cap_searches + ' web searches.' }),
        el('p', { class: 'meta', text: 'When this runs out, the auto-grader, the code reviewer, '
          + 'search and the filing system all keep working — none of them use the model.' }),
      ]));
    }

    /* Appearance lives here rather than in the header: the palette is one
       click away up there, and the code theme wants room to say what each
       one is for. */
    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: 'Appearance' }),
      el('p', { class: 'meta', text:
        'Two colour systems, kept apart. The palette colours the site — header, rail and every '
        + 'card. The code theme colours only code, so a dark page with light code is allowed.' }),
      el('div', { class: 'row', style: 'margin-top:10px;flex-wrap:wrap;gap:14px' }, [
        el('label', { class: 'f', style: 'margin:0;min-width:220px' }, [
          el('span', { text: 'Site palette' }),
          selectOf(PALETTES, document.documentElement.getAttribute('data-palette') || '',
            (v) => applyPalette(v)),
        ]),
        el('label', { class: 'f', style: 'margin:0;min-width:220px' }, [
          el('span', { text: 'Code theme' }),
          selectOf(CODE_THEMES, document.documentElement.getAttribute('data-codetheme') || '',
            (v) => applyCodeTheme(v)),
        ]),
      ]),
      el('pre', { text: '<cfquery name="staff" datasource="larkspur">\n'
        + '  SELECT last_name FROM employees\n'
        + '  WHERE  district_id = <cfqueryparam value="#session.districtID#">\n'
        + '</cfquery>' }),
    ]));

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: 'How long things are kept' }),
      el('p', { class: 'meta', text:
        'Nothing is destroyed when it is deleted — it becomes recoverable for a window that depends on '
        + 'what it is. Work you handed in and the feedback on it are kept for three years, so an appeal '
        + 'or an audit can still reach them. Notes and resources go sooner.' }),
    ]));

    wrap.appendChild(el('div', { class: 'card' }, [
      el('h3', { text: 'Take a copy' }),
      el('p', { class: 'meta', text:
        'A single file with your enrolments, everything you handed in, every mark and who confirmed it, '
        + 'your files, and your conversations with the assistant.' }),
      el('a', { class: 'btn primary', href: '/api/export/' + state.me.user.id,
        download: 'lantern-export.json' }, 'Download my record'),
    ]));

    if (state.me.wards && state.me.wards.length) {
      wrap.appendChild(el('h2', { text: 'Your students', style: 'margin-top:26px' }));
      state.me.wards.forEach((w) => {
        wrap.appendChild(el('div', { class: 'card' }, el('div', { class: 'row' }, [
          el('span', { text: w.name }),
          el('span', { style: 'flex:1' }),
          el('button', { class: 'btn small',
            onclick: () => go('files', { path: '/people/' + w.id + '/portfolio' }) }, 'Portfolio'),
          el('a', { class: 'btn small', href: '/api/export/' + w.id,
            download: 'lantern-export.json' }, 'Download their record'),
        ])));
      });
      wrap.appendChild(el('p', { class: 'meta', text:
        'You see work once it has been handed in. Drafts stay private, because a draft is thinking out '
        + 'loud and a system that shows it teaches children not to think in the system.' }));
    }
  }

  /* -------------------------------------------------------------- studio */

  /* The studio, with the assistant able to sit beside it. The studio tells the
     shell which page is open (a postMessage from its own go()), so asking
     "why is this failing?" needs no explanation of where you are. */
  function viewStudio(m) {
    const wrap = el('div', { class: 'wrap', style: 'max-width:none' });
    m.appendChild(wrap);

    const chatBtn = el('button', { class: 'btn small', onclick: toggle }, 'Ask about this page');
    wrap.appendChild(el('div', { class: 'row', style: 'margin-bottom:12px' }, [
      el('h1', { text: 'The studio', style: 'margin:0' }),
      el('span', { style: 'flex:1' }),
      el('span', { class: 'chip', id: 'studioctx', text: 'loading…' }),
      chatBtn,
    ]));

    const frame = el('iframe', { class: 'studio', src: '/dist/cfml-studio.html'
      + (state.args.hash ? '#' + state.args.hash : ''), title: 'CFML Studio',
    onload: () => tellTheStudio(
      document.documentElement.getAttribute('data-palette') || '',
      document.documentElement.getAttribute('data-codetheme') || '') });
    const side = el('div', { class: 'sidechat hidden' });
    const holder = el('div', { class: 'studiowrap' }, [frame, side]);
    wrap.appendChild(holder);

    let built = false;
    function toggle() {
      const on = holder.classList.toggle('withchat');
      side.classList.toggle('hidden', !on);
      chatBtn.textContent = on ? 'Hide the assistant' : 'Ask about this page';
      if (on && !built) { built = true; buildSideChat(side); }
    }
  }

  /* Where the learner is inside the studio, kept up to date by the iframe. */
  state.studioAt = null;
  window.addEventListener('message', (e) => {
    const d = e.data;
    // The studio has its own picker in its header. When it is used, the shell
    // around it follows rather than arguing.
    if (d && d.lantern === 'palette') {
      if (d.id !== undefined) applyPalette(d.id || '');
      if (d.code !== undefined) applyCodeTheme(d.code || '');
      return;
    }
    if (!d || d.lantern !== 'nav') return;
    state.studioAt = { id: d.id, title: d.title, kind: d.kind };
    const chip = $('#studioctx');
    if (chip) chip.textContent = d.title || d.id;
    const ctxChip = document.querySelector('.sidechat .ctxchip');
    if (ctxChip) ctxChip.textContent = 'About: ' + (d.title || d.id);
  });

  function buildSideChat(side) {
    const transcript = el('div', { class: 'transcript' });
    const box = el('textarea', { rows: 2, placeholder: 'Ask about the page you are on…' });
    const send = el('button', { class: 'btn primary', onclick: ask }, 'Ask');

    side.appendChild(el('div', { class: 'hd' }, [
      el('b', { text: 'Assistant' }),
      el('span', { class: 'ctxchip', text: state.studioAt
        ? 'About: ' + state.studioAt.title : 'About: the studio' }),
    ]));
    side.appendChild(transcript);
    side.appendChild(el('div', { class: 'composer' }, el('div', { class: 'box' }, [box, send])));

    if (!state.me.ai.configured) {
      transcript.appendChild(el('p', { class: 'meta', text:
        'The assistant needs an ANTHROPIC_API_KEY on this server. Everything else in the studio — '
        + 'running your code, the checks and the code review — works without it.' }));
      box.disabled = send.disabled = true;
      return;
    }

    transcript.appendChild(el('p', { class: 'meta', text:
      'It knows which lesson you have open and what you have passed. It will not hand you the answer '
      + 'to an exercise you are still working on.' }));

    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    async function ask() {
      const text = box.value.trim();
      if (!text || state.sending) return;
      state.sending = true;
      box.value = '';
      if (transcript.querySelector('.meta')) transcript.innerHTML = '';
      transcript.appendChild(turn('user', markdown(text)));
      const pending = el('div', { class: 'turn assistant' }, [
        el('div', { class: 'role', text: 'Assistant' }), el('div', { class: 'bubble' })]);
      transcript.appendChild(pending);
      send.disabled = true;
      try {
        const at = state.studioAt || {};
        await streamChat({
          text, web: true, classId: (state.me.classes[0] || {}).id,
          situation: {
            where: 'the studio',
            lessonId: at.id, lessonTitle: at.title,
            graded: at.kind === 'lesson' || at.kind === 'check',
          },
          into: pending, transcript,
        });
      } catch (e) {
        pending.querySelector('.bubble').appendChild(
          el('p', { class: 'err', text: e.detail || e.message }));
      }
      send.disabled = false;
      state.sending = false;
    }
  }

  /* --------------------------------------------------------------- class */

  async function viewClass(m) {
    const wrap = el('div', { class: 'wrap' });
    m.appendChild(wrap);
    const cls = (state.me.classes.filter((c) => c.role === 'teacher' || c.role === 'ta')[0]) || state.me.classes[0];
    if (!cls) { wrap.appendChild(el('h1', { text: 'Class' }));
      wrap.appendChild(el('div', { class: 'empty', text: 'You are not teaching anything yet.' })); return; }

    wrap.appendChild(el('h1', { text: cls.title }));
    wrap.appendChild(el('p', { class: 'lede', text: cls.course + ' · ' + cls.code }));

    let ov, craft;
    try {
      [ov, craft] = await Promise.all([
        api('/api/classes/' + cls.id + '/overview'),
        api('/api/classes/' + cls.id + '/craft'),
      ]);
    } catch (e) {
      wrap.appendChild(el('div', { class: 'card' }, el('p', { class: 'meta', text: e.why || e.message })));
      return;
    }

    /* The one sentence first. A grid is what you read second. */
    wrap.appendChild(el('div', { class: 'teachnote' }, [
      el('b', { text: ov.summary.sentence }),
      craft.teach ? el('div', { class: 'meta', style: 'margin-top:5px', text: craft.teach }) : null,
    ]));

    wrap.appendChild(el('div', { class: 'grid', style: 'margin-bottom:22px' }, [
      stat(ov.summary.students, 'students'),
      stat(ov.summary.notStarted, 'have not started'),
      stat(ov.summary.awaitingConfirmation, 'grades to confirm'),
      stat(craft.averageCraft === null ? '—' : craft.averageCraft, 'average craft'),
    ]));

    /* --- what to re-teach ------------------------------------------------ */
    wrap.appendChild(el('h2', { text: 'What to re-teach' }));
    wrap.appendChild(el('p', { class: 'lede', text:
      'Every code-review finding across the class, counted by how many students hit it. A problem in '
      + 'fifteen submissions is one lesson, not fifteen conversations.' }));
    if (!craft.findings.length) {
      wrap.appendChild(el('div', { class: 'empty', text: 'Nothing graded yet, so there is nothing to count.' }));
    }
    craft.findings.forEach((f) => {
      const share = craft.students.length ? f.students.length / craft.students.length : 0;
      wrap.appendChild(el('div', { class: 'finding ' + f.severity }, [
        el('div', { class: 'hd' }, [
          el('b', { text: f.label }),
          el('span', { class: 'sev', text: f.severity }),
        ]),
        el('div', { class: 'spread', style: 'margin:8px 0' }, [
          el('span', { class: 'track' }, el('i', { style: 'width:' + Math.round(share * 100) + '%' })),
          el('b', { text: f.students.length + ' of ' + craft.students.length }),
        ]),
        f.why ? el('p', { class: 'why', text: f.why }) : null,
        el('p', { class: 'meta', text: 'Who: ' + f.students.join(', ')
          + ' · ' + f.assignments.map((a) => a.title).join(', ') }),
        f.better ? el('div', { class: 'better' }, [
          el('span', { class: 'k', text: 'What to show them' }),
          /[<#]/.test(f.better) ? el('pre', { text: f.better }) : el('p', { text: f.better }),
        ]) : null,
      ]));
    });

    /* --- who has handed in what ------------------------------------------ */
    wrap.appendChild(el('h2', { text: 'Who has handed in what', style: 'margin-top:28px' }));
    const head = el('tr', null, [el('th', { text: 'Student' })]
      .concat(ov.assignments.map((a) => el('th', { text: a.title }))));
    const body = el('tbody', null, ov.rows.map((r) => el('tr', null,
      [el('td', { text: r.student.name })].concat(r.cells.map((c) => el('td', { class: 'num' }, [
        el('span', { class: 'cellstate ' + (c.state === 'not started' ? 'none' : c.state),
          text: c.state === 'not started' ? '—' : c.state }),
        c.score !== null && c.score !== undefined
          ? el('span', { text: '  ' + c.score + (c.confirmed ? '' : '?') ,
            title: c.confirmed ? 'confirmed' : 'a recommendation — not confirmed' })
          : null,
      ]))))));
    wrap.appendChild(el('div', { class: 'gradegrid' },
      el('table', null, [el('thead', null, head), body])));
    wrap.appendChild(el('p', { class: 'meta', style: 'margin-top:8px',
      text: 'A score with a ? beside it is a recommendation the auto-grader or the assistant produced. '
        + 'It counts for nothing until you confirm it.' }));

    /* --- weakest first ---------------------------------------------------- */
    if (craft.students.length) {
      wrap.appendChild(el('h2', { text: 'Craft, weakest first', style: 'margin-top:28px' }));
      craft.students.forEach((st) => {
        wrap.appendChild(el('div', { class: 'card' }, el('div', { class: 'row' }, [
          el('span', { text: st.name }),
          el('span', { style: 'flex:1' }),
          el('span', { class: 'meta', text: st.findings + ' finding(s) across ' + st.submissions
            + ' submission(s)' + (st.unfinished ? ' · ' + st.unfinished + ' not working yet' : '') }),
          el('span', { class: 'pill' + (st.craft === null ? ' bad' : st.craft >= 72 ? ' ok' : st.craft >= 50 ? ' warn' : ' bad'),
            title: st.craft === null
              ? 'Craft is only scored on work that passes its checks. This has not got there yet.'
              : 'Average craft across the work that passes',
            text: st.craft === null ? st.state : st.craft + '/100' }),
        ])));
      });
    }

    wrap.appendChild(el('h2', { text: 'Class files', style: 'margin-top:28px' }));
    wrap.appendChild(el('button', { class: 'btn', onclick: () => go('files', { path: '/classes/' + cls.id + '/resources' }) },
      'Open the class folder'));
  }

  const stat = (n, label) => el('div', { class: 'card stat' }, [
    el('b', { text: String(n) }), el('span', { text: label })]);

  boot();
})();
</script>
</body>
</html>
